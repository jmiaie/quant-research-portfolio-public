[build-system]
requires = ["setuptools>=69,<71", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-portfolio"
version = "0.1.0"
description = "Curated quantitative finance research portfolio and validation hub."
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{ name = "jmiaie" }]
dependencies = [
  "numpy>=1.26,<3.0",
  "pandas>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<1.12",
  "pytest>=8.3,<9.0",
  "ruff>=0.6,<0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
ignore_missing_imports = true
